name: Build Windows (zh)

# Manual one-click Windows x64 build for the Chinese fork.
# Same toolchain and RUSTFLAGS as release.yml, no tests, no release.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build (Windows x86_64)
    runs-on: windows-2025
    env:
      # The C runtime linked in, so disktree.exe runs without the
      # Visual C++ runtime installed (same as release.yml).
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p disktree-app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: disktree-zh-windows-x64
          path: target/release/disktree.exe
          if-no-files-found: error
